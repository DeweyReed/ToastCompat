apply plugin: 'com.android.library'
// apply plugin: 'jacoco'
// apply from: 'gradle-mvn-push.gradle'
// apply from: 'checkstyle.gradle'
apply plugin: 'maven-publish'
apply plugin: 'kotlin-android'

group = 'com.github.DeweyReed'
version = '1.1'

android {
  namespace = "me.drakeet.support.toast"
  compileSdk gradle.compileSdkVersion

  defaultConfig {
    minSdk gradle.minSdkVersion
    targetSdk gradle.targetSdkVersion
    versionCode gradle.versionCode
    versionName gradle.versionName
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  publishing {
    singleVariant('release') {
      withSourcesJar()
    }
  }
}

dependencies {
  // testImplementation 'junit:junit:4.12'
  implementation 'androidx.appcompat:appcompat:1.7.0'
}

afterEvaluate {
  publishing {
    publications {
      // Creates a Maven publication called "release".
      release(MavenPublication) {
        from components.release
        groupId = 'com.github.DeweyReed'
        artifactId = 'toastcompat'
        version = '1.1'
      }
    }
  }
}
